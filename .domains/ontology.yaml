id: agentic-engineering
name: Agentic Engineering Knowledge
description: Knowledge for people building agentic products, and for coding agents handed this pack as context. Every fact is distilled from a named external source and carries at least one URL. The bar is altitude — if a competent model would already produce the claim at this specificity from its own priors, it does not belong here.
topics:
  architecture:
    description: Structural patterns — how agent components fit together, and the conditions where a shape stops being the right one
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — tools and MCP, context-engineering, multi-agent, runtime, security, guardrails, interop, operations, state-management, coding-agents
          rag:
            description: Retrieval-augmented generation and long-context behaviour
  conventions:
    description: Idioms and practices that work, stated with the reason and the boundary condition rather than generically
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — tools, coding-agents, evaluation, prompting, reliability, design, frameworks, operations
          rag:
            description: Retrieval-augmented generation and long-context behaviour
  decisions:
    description: Tradeoffs with rationale and the conditions that decide them, including live disagreements between credible sources kept as a decision rather than flattened
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — context-engineering, multi-agent, orchestration, reasoning, evaluation, harness-design, model-selection, reliability, tools, architecture-patterns
          rag:
            description: Retrieval strategy and long-context tradeoffs
  gotchas:
    description: Sharp edges and surprises — an observable symptom paired with its stated cause
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — evaluation, tools, coding-agents, multi-agent, reliability, context-engineering, security, prompting, frameworks
          rag:
            description: Retrieval and long-context failure modes
  incidents:
    description: A specific documented failure and its fix, anchored to a published account
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — security incidents, exfiltration, autonomous intrusion
  invariants:
    description: Load-bearing rules — violate one and it breaks. Spec-level constraints and hard limits belong here
    children:
      ai:
        description: All knowledge in this pack sits under ai/
        children:
          agents:
            description: Agent engineering — security, tools and MCP, reliability, frameworks, prompting
          governance:
            description: Regulatory and risk-management frameworks (NIST AI RMF, and similar)
  meta:
    description: Knowledge about the knowledge — pack spec and crawl-job state, not knowledge of the field itself
    children:
      jobs:
        description: Per-job state. Holds the read-only spec mirror, the recurring source list, and the last crawl run
      ontology:
        description: Notes about how this ontology is used
      reasoning:
        description: Methodology facts from knomit_review/hypothesize
  principles:
    description: Designer-authored intent — mission, philosophy, anti-patterns, UX taste
    validations:
      - name: must-have-designer-entity
        message: principles must be authored via /knomit-principle (entities must include 'designer')
        rule: fact.entities.includes('designer')
      - name: must-be-pragmatic-policy
        message: principles must declare kind=pragmatic and type=policy
        rule: fact.kind === 'pragmatic' && fact.type === 'policy'
      - name: domain-mutually-exclusive
        message: domain must be either ['global'] or an area path, never both
        rule: '!(fact.domain.includes(''global'') && fact.domain.length > 1)'
      - name: domain-non-empty
        message: domain is required
        rule: fact.domain.length > 0
    children:
      anti-patterns:
        description: Choices the designer rejects
      mission:
        description: What this pack exists to solve, who it's for
      philosophy:
        description: Mental-model rules that span subsystems
      ux:
        description: Interaction taste, voice, pacing
